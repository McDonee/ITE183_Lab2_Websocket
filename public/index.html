<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b2b">
  <title>Wire | BSL WebSocket Chat</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #173331;
      --muted: #647773;
      --paper: #f4f4ed;
      --panel: #fffefa;
      --line: #dce3db;
      --green: #157a67;
      --green-dark: #105c50;
      --lime: #d4ef6a;
      --red: #a63d37;
      --mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      --sans: "Trebuchet MS", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 18px;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#cfd9cb 0.7px, transparent 0.7px);
      background-size: 15px 15px;
      font-family: var(--sans);
    }
    main { width: min(760px, 100%); margin: 0 auto; }
    .masthead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 4px 2px 20px;
      border-bottom: 1px solid #becbc0;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      color: var(--lime);
      background: var(--ink);
      font: 700 21px var(--mono);
    }
    .brand-name { margin: 0; font-size: 16px; font-weight: 700; }
    .brand-caption {
      margin: 3px 0 0;
      color: var(--muted);
      font: 11px var(--mono);
      letter-spacing: 0;
    }
    .protocol { color: var(--muted); font: 11px var(--mono); }
    .protocol strong { color: var(--green-dark); }
    .intro { padding: 30px 2px 22px; }
    .eyebrow { margin: 0 0 8px; color: var(--green); font: 11px var(--mono); }
    h1 { margin: 0; font-size: 42px; line-height: 1.08; }
    .intro p:last-child { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
    .chat {
      overflow: hidden;
      border: 1px solid #c8d3c8;
      background: var(--panel);
      box-shadow: 5px 5px 0 #d9e1d6;
    }
    .chat-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    .chat-label { margin: 0; font-size: 13px; font-weight: 700; }
    #status { display: flex; align-items: center; gap: 7px; color: var(--muted); font: 11px var(--mono); }
    #status::before { width: 8px; height: 8px; border-radius: 50%; background: #d09b39; content: ""; }
    #status.connected::before { background: #27936e; }
    #status.disconnected::before { background: #b94b43; }
    #log {
      display: flex;
      height: min(48vh, 390px);
      min-height: 230px;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      padding: 18px 16px;
      background: #fbfcf8;
      font: 12px/1.5 var(--mono);
    }
    .entry { max-width: 100%; overflow-wrap: anywhere; }
    .sent { color: #176f5d; }
    .received { color: #263d39; }
    .system { color: #78857e; font-style: italic; }
    .composer {
      display: flex;
      gap: 9px;
      padding: 12px;
      border-top: 1px solid var(--line);
      background: #f3f6ef;
    }
    input {
      min-width: 0;
      flex: 1;
      padding: 11px 12px;
      border: 1px solid #cbd6cb;
      border-radius: 0;
      outline-color: var(--green);
      background: white;
      color: var(--ink);
      font: 13px var(--sans);
    }
    button {
      min-width: 92px;
      padding: 0 16px;
      border: 0;
      border-radius: 0;
      color: white;
      background: var(--green);
      font: 700 12px var(--sans);
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--green-dark); }
    button:disabled, input:disabled { cursor: not-allowed; opacity: .55; }
    .foot {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 2px 0;
      color: var(--muted);
      font: 10px var(--mono);
    }
    @media (max-width: 480px) {
      body { padding: 18px 12px; }
      .protocol { font-size: 10px; text-align: right; }
      .intro { padding-top: 25px; }
      h1 { font-size: 31px; }
      .composer { gap: 7px; padding: 9px; }
      button { min-width: 74px; padding: 0 10px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="masthead">
      <div class="brand">
        <div class="mark" aria-hidden="true">W</div>
        <div>
          <p class="brand-name">Wire / BSL</p>
          <p class="brand-caption">ITE183 / LAB 02</p>
        </div>
      </div>
      <div class="protocol">TRANSPORT <strong>WEBSOCKET</strong></div>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">REAL-TIME / MULTI-CLIENT</p>
      <h1 id="page-title">The room is live.</h1>
      <p>Messages are broadcast to every connected browser.</p>
    </section>

    <section class="chat" aria-label="WebSocket chat">
      <div class="chat-head">
        <p class="chat-label"># general</p>
        <div id="status" role="status" aria-live="polite">Connecting</div>
      </div>
      <div id="log" role="log" aria-live="polite" aria-relevant="additions"></div>
      <form class="composer" id="messageForm">
        <input id="msgInput" type="text" autocomplete="off" maxlength="1000" placeholder="Write a message..." aria-label="Message" disabled>
        <button id="sendBtn" type="submit" disabled>Send message</button>
      </form>
    </section>
    <footer class="foot"><span>SERVER :8000</span><span id="endpoint"></span></footer>
  </main>

  <script>
    const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    const wsUrl = wsProtocol + "//" + window.location.host;
    const socket = new WebSocket(wsUrl);
    const status = document.getElementById("status");
    const log = document.getElementById("log");
    const input = document.getElementById("msgInput");
    const sendButton = document.getElementById("sendBtn");
    const form = document.getElementById("messageForm");

    document.getElementById("endpoint").textContent = wsUrl;

    function appendLog(text, className) {
      const entry = document.createElement("div");
      entry.className = "entry " + className;
      entry.textContent = text;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    }

    socket.addEventListener("open", function () {
      status.textContent = "Connected";
      status.className = "connected";
      input.disabled = false;
      sendButton.disabled = false;
      input.focus();
      appendLog("Connection established. You are in the room.", "system");
    });

    socket.addEventListener("message", function (event) {
      appendLog(event.data, "received");
    });

    socket.addEventListener("close", function () {
      status.textContent = "Disconnected";
      status.className = "disconnected";
      input.disabled = true;
      sendButton.disabled = true;
      appendLog("Connection closed by server.", "system");
    });

    socket.addEventListener("error", function () {
      appendLog("WebSocket connection error.", "system");
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      const message = input.value.trim();
      if (message && socket.readyState === WebSocket.OPEN) {
        socket.send(message);
        appendLog("You: " + message, "sent");
        input.value = "";
        input.focus();
      }
    });
  </script>
</body>
</html>
