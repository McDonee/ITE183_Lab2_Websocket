<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 | Wire / BSL</title>
  <style>
    :root { color-scheme: light; --ink: #173331; --green: #157a67; --paper: #f4f4ed; }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      margin: 0;
      padding: 24px;
      color: var(--ink);
      background: var(--paper);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }
    main { width: min(520px, 100%); padding: 10px 0; border-top: 4px solid var(--green); }
    .code { margin: 20px 0 8px; color: var(--green); font: 12px Consolas, monospace; }
    h1 { margin: 0; font-size: 38px; }
    p { color: #647773; line-height: 1.6; }
    a { color: var(--green); font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <p class="code">HTTP / 404</p>
    <h1>Page not found.</h1>
    <p>The requested route is not available on this server.</p>
    <a href="/">Return to the chat</a>
  </main>
</body>
</html>
